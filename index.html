<body>
    <main class="prototype">
        <header class="intro">
            <p class="label">Garden of Sounds</p>
            <h1>Mapping Prototype 1</h1>
            <p>Drag the flower into the sky, garden, or underground, then release it to hear its note.</p>
        </header>

        <section id="sound-canvas" class="sound-canvas" aria-label="Three-zone garden sound canvas">
            <div class="zone zone--sky" data-zone="sky" aria-hidden="true"><span>Sky</span></div>
            <div class="zone zone--garden" data-zone="garden" aria-hidden="true"><span>Garden</span></div>
            <div class="zone zone--underground" data-zone="underground" aria-hidden="true"><span>Underground</span></div>

            <!-- A button gives the draggable object a meaningful accessible name. -->
            <button id="draggable-flower" class="draggable-flower" type="button" aria-label="Draggable flower">
                <span aria-hidden="true">*</span>
            </button>
