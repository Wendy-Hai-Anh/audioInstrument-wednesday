<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garden of Sounds</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
</head>
<body>
    <main class="garden-app">
        <section class="garden-canvas" aria-labelledby="prototype-title">
            <div class="sky-glow" aria-hidden="true"></div>
            <div class="garden-ground" aria-hidden="true"></div>

            <header class="prototype-copy">
                <p class="eyebrow">Interaction Prototype</p>
                <h1 id="prototype-title">Garden of Sounds</h1>
                <p class="instructions">Click, tap, or press Enter or Space on the flower.</p>
            </header>

            <button
                id="flower-button"
                class="flower-button"
                type="button"
                aria-describedby="note-status"
                aria-label="Play the next flower note"
            >
                <span class="flower-button__stem" aria-hidden="true"></span>
                <span class="flower-button__leaf flower-button__leaf--left" aria-hidden="true"></span>
                <span class="flower-button__leaf flower-button__leaf--right" aria-hidden="true"></span>
                <span class="flower-button__bloom" aria-hidden="true">
                    <span class="flower-button__petal flower-button__petal--top"></span>
                    <span class="flower-button__petal flower-button__petal--right"></span>
                    <span class="flower-button__petal flower-button__petal--bottom"></span>
                    <span class="flower-button__petal flower-button__petal--left"></span>
                    <span class="flower-button__center"></span>
                </span>
            </button>
            <section class="track-controls" aria-label="Audio track controls">
                <audio id="audio-track" controls preload="metadata">
                    <source src="./asset/audio/p-hase_Leapt.mp3" type="audio/mpeg">
                    Your browser does not support audio playback.
                </audio>
                <div class="track-buttons">
                    <button id="key-test" type="button" data-note="D4">Key</button>
                    <button id="play-button" type="button">Play track</button>
                    <button id="random-time" type="button">Random time</button>
                    <input type="range" id="osc-range" name="osc-range">
                    <label for ="osc-range">change osc</label> 
                    <img src="https://upload.wikimedia.org/wikipedia/commons/4/4a/Augusta_Dohlmann_Wild_flowers_%281905%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" 
                    alt="painting of flowwers in a vase" id="flower-painting" data-note="a3">
                </div>
            </section>
        </section>
    </main>
</body>
</html>
